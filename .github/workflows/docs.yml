name: Docs

on:
  push:
    paths:
      - "docs/**"
      - "*.md"
      - "scripts/check_doc_links.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "scripts/check_doc_links.sh"
      - ".github/workflows/docs.yml"

jobs:
  docs_build:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Install git for checkout
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Sphinx toolchain
        run: |
          apt-get update && apt-get install -y imagemagick
          pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Check docs build (warnings are errors)
        run: bash scripts/check_doc_links.sh
  docs_linkcheck:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Install git for checkout
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Sphinx toolchain
        run: |
          apt-get update && apt-get install -y imagemagick
          pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Check external links (informational only)
        continue-on-error: true
        run: |
          sphinx-build -q -b linkcheck docs docs/_build/linkcheck || true
          echo "=== broken/timeout links ==="
          grep -E '\[(broken|timeout)\]' docs/_build/linkcheck/output.txt || echo "(none)"
