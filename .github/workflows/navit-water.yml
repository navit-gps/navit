name: Water polygon regression

on:
  push:
    branches: [trunk, 'fix/water-*']
  pull_request:
    paths:
      - 'navit/maptool/**'
      - 'navit/geom.c'
      - 'contrib/coastline-polygons.py'
      - 'contrib/test_*.py'
      - 'contrib/test_polygon_containment.c'
      - '.github/workflows/navit-water.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  water_fixtures:
    runs-on: ubuntu-latest
    container: debian:latest
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config gettext \
            libglib2.0-dev zlib1g-dev liblzma-dev libprotobuf-c-dev protobuf-c-compiler python3 python3-shapely python3-pyshp
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build maptool
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_MAPTOOL=ON -DDISABLE_CXX=ON \
            -DUSE_PLUGINS=ON -DUSE_SVG=OFF -Dgraphics/egl=OFF -Dgraphics/opengl=OFF
          cmake --build build --target maptool
      - name: Point-in-polygon check
        run: |
          cc -I navit -I build -I build/navit contrib/test_polygon_containment.c navit/geom.c \
            $(pkg-config --cflags --libs glib-2.0) -lm -o build/containment
          build/containment
      - name: Ring, open-way and ocean fixtures with water and dry controls
        run: |
          for test in test_water_rings test_inland_water test_water_incomplete test_water_bounds test_water_invalid test_water_rejection test_water_junctions test_ocean_polygons; do
            python3 contrib/$test.py . build/navit/maptool/maptool "build/$test"
            echo "$test: passed"
          done
